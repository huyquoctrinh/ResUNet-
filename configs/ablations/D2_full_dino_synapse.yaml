# Ablation: D2_full_dino | Dataset: synapse | Phase 2
backbone: pvt_v2_b2
num_heads: 8
attn_drop: 0.0
proj_drop: 0.0
lr_backbone: 0.0001
lr_new: 0.001
weight_decay: 0.0001
warmup_epochs: 10
grad_clip: 1.0
amp: true
val_every: 1
early_stopping_patience: 50
log_dir: runs
save_every: 50
tensorboard: true
num_workers: 4
seed: 42
dataset: synapse
data_root: dataset/preprocessed_synapse_CASCADE
list_dir: dataset/preprocessed_synapse_CASCADE
in_channels: 1
num_classes: 9
img_size:
- 224
- 224
class_names:
- bg
- aorta
- gallbladder
- left_kidney
- right_kidney
- liver
- pancreas
- spleen
- stomach
nclass: 9
epochs: 110
batch_size: 16
ignore_background: true
ablation:
  name: D2_full_dino
  edge_type: learned
  attention_type: cross_attention
  q_source: encoder
  attention_scales:
  - enc3
  - enc4
kd:
  enabled: true
  teacher: dinov3
  teacher_model: facebook/dinov3-vitb16-pretrain-lvd1689m
  kd_weight: 1.0
  teacher_img_size: 224
