# Ablation: A1_concat | Dataset: acdc | Phase 1
backbone: pvt_v2_b0
num_heads: 8
attn_drop: 0.0
proj_drop: 0.0
lr_backbone: 0.0001
lr_new: 0.001
weight_decay: 0.0001
warmup_epochs: 10
grad_clip: 1.0
amp: true
val_every: 1
early_stopping_patience: 50
log_dir: runs
save_every: 50
tensorboard: true
num_workers: 4
seed: 42
dataset: acdc
data_root: dataset/ACDC
list_dir: dataset/ACDC/lists_ACDC
in_channels: 1
num_classes: 4
img_size:
- 224
- 224
class_names:
- bg
- RV
- Myo
- LV
epochs: 200
batch_size: 8
ignore_background: true
ablation:
  name: A1_concat
  edge_type: learned
  attention_type: concat
  q_source: encoder
  attention_scales:
  - enc3
  - enc4
