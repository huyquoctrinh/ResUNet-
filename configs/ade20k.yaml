_base_: default.yaml

data:
  dataset: ade20k
  root: /home/mamba/ML_project/Testing/Huy/med_seg/dataset/ade20k
  in_channels: 3
  num_classes: 151          # 150 scene-parsing categories + void (class 0)
  spatial_dim: 2
  img_size: [512, 512]
  num_top_classes: 150      # top N classes by pixel frequency from training set
  class_names: null         # auto-generated from dataset scan

model:
  encoder_type: pvt_v2
  pvt_variant: b0
  pvt_pretrained: true
  patch_size: 4
  spatial_dim: 2
  deep_supervision: true

training:
  batch_size: 8
  epochs: 200
  lr: 6.0e-5
  weight_decay: 0.01
  warmup_epochs: 10
  loss_alpha: 0.4           # 0.4*CE + 0.6*Dice

evaluation:
  ignore_background: true   # ignore void (class 0) in metrics
